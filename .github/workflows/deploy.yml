name: Deploy Working Time

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check deployment configuration
        id: deployment_gate
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          missing=()
          [[ -n "$CF_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$GOOGLE_CLIENT_ID" ]] || missing+=(GOOGLE_CLIENT_ID)
          [[ -n "$GOOGLE_CLIENT_SECRET" ]] || missing+=(GOOGLE_CLIENT_SECRET)
          [[ -n "$SESSION_SECRET" ]] || missing+=(SESSION_SECRET)
          [[ -n "$GOOGLE_REDIRECT_URI" ]] || missing+=(GOOGLE_REDIRECT_URI)
          grep -Eq 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml && missing+=(D1_database_id_in_wrangler.toml)
          grep -Eq 'APP_URL = "http://localhost' wrangler.toml && missing+=(production_APP_URL_in_wrangler.toml)

          if ((${#missing[@]})); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Build succeeded; deployment skipped'
              echo
              echo 'Configure the following before deploying:'
              for item in "${missing[@]}"; do echo "- `$item`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Build passed. Deployment skipped because production configuration is incomplete. See the job summary."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.deployment_gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply working-time-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync Worker secrets
        if: steps.deployment_gate.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
        run: |
          printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          printf '%s' "$GOOGLE_REDIRECT_URI" | npx wrangler secret put GOOGLE_REDIRECT_URI

      - name: Deploy to Cloudflare Workers
        if: steps.deployment_gate.outputs.ready == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
